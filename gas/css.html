<style>
:root {
  --blue:       #004EA5;
  --blue-light: #359aee;
  --dark:       #1c1c28;
  --body-text:  #212529;
  --gray:       #8f90a6;
  --red:        #e53535;
  --green:      #06c270;
  --purple:     #9615aa;
  --light:      #f8f9fa;
  --border:     #e4e6ef;
  --hdr-h:      64px;
  --sb-w:       230px;
  --foot-bg:    #004EA5;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Montserrat', sans-serif; background: #f0f2f5; color: var(--body-text); font-size: 14px; font-weight: 500; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
button { cursor: pointer; font-family: inherit; }
img { max-width: 100%; display: block; }

/* ===== TOP PROMO BAR ===== */
#topBar {
  background: #0a1628; color: #fff; font-size: 11px;
  display: flex; align-items: stretch; min-height: 48px;
}
.tb-delivery {
  background: linear-gradient(135deg,#0d6efd 0%,#0a4fd4 100%);
  display: flex; align-items: center; gap: 10px;
  padding: 6px 20px; flex-shrink: 0; white-space: nowrap;
}
.tb-delivery .tb-truck { font-size: 22px; }
.tb-delivery strong { display: block; font-size: 12px; font-weight: 800; }
.tb-delivery span   { font-size: 10px; color: #cde; }
.tb-promo {
  background: #0e1f3d; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 6px 24px;
  border-left: 1px solid rgba(255,255,255,.08); border-right: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.tb-promo .promo-date  { font-size: 12px; font-weight: 700; color: #ffd700; }
.tb-promo .promo-deal  { font-size: 11px; color: #bcd; }
.tb-promo .promo-deal strong { color: #ffd700; font-size: 13px; }
.tb-advs { display: flex; align-items: center; flex: 1; padding: 0 12px; overflow: hidden; }
.tb-adv  { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-right: 1px solid rgba(255,255,255,.08); flex: 1; min-width: 0; }
.tb-adv:last-child { border-right: none; }
.tb-adv i    { font-size: 17px; color: #6ea8fe; flex-shrink: 0; }
.tb-adv span { font-size: 10px; color: #cde; line-height: 1.3; }

/* ===== INFO BAR ===== */
#infoBar { background: var(--blue); color: #fff; font-size: 12px; }
#infoBar .ib-inner { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 8px 20px; }
#infoBar p { margin: 0; }
.ib-close { background: #dc3545; color: #fff; border: none; border-radius: 4px; padding: 3px 12px; font-size: 11px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
.ib-close:hover { background: #fff; color: #dc3545; }

/* ===== LOGO NAV ===== */
#logoNav {
  background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 8px 0;
}
#logoNav .logo {
  width: var(--sb-w); flex-shrink: 0;
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
}
#logoNav .nav-links { display: flex; gap: 24px; font-size: 12px; font-weight: 600; padding: 0 16px; }
#logoNav .nav-links a { color: #444; transition: color .18s; }
#logoNav .nav-links a:hover { color: var(--blue); }

/* ===== STICKY HEADER ===== */
#stickyHdr {
  position: sticky; top: 0; z-index: 200;
  background: #fff; border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  height: var(--hdr-h);
  display: flex; align-items: center; padding: 0; gap: 0;
}
/* Hamburguesa: solo mobile */
.mob-menu-btn { background: none; border: none; font-size: 22px; color: var(--dark); padding: 4px 8px; display: none; flex-shrink: 0; }
/* Botón Catálogo: mismo ancho que sidebar → alineado con logo y sidebar */
#menuToggleButton {
  width: var(--sb-w); flex-shrink: 0; height: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-right: 1px solid var(--border);
  background: var(--blue); color: #fff;
  font-size: 13px; font-weight: 700; white-space: nowrap; transition: background .18s;
}
#menuToggleButton:hover  { background: #003d87; }
#menuToggleButton.active { background: #003d87; }
.search-row { flex: 1; display: flex; align-items: center; padding: 0 16px; }
.search-row input {
  flex: 1; height: 40px;
  border: 2px solid var(--border); border-right: none;
  border-radius: 8px 0 0 8px; padding: 0 16px; font-size: 13px; outline: none;
  font-family: inherit; transition: border-color .18s;
}
.search-row input:focus { border-color: var(--blue); }
.search-row .s-btn { height: 40px; width: 48px; background: var(--blue); color: #fff; border: none; border-radius: 0 8px 8px 0; font-size: 15px; }
.search-row .s-btn:hover { background: #003d87; }
.hdr-actions { display: flex; align-items: center; gap: 2px; padding-right: 8px; }
.act-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; padding: 4px 12px; border-radius: 8px;
  font-size: 10px; font-weight: 500; color: var(--dark); transition: background .18s; position: relative;
}
.act-btn:hover { background: #f0f2f8; }
.act-btn i { font-size: 18px; }
.act-btn .badge {
  position: absolute; top: 2px; right: 8px;
  background: var(--red); color: #fff; border-radius: 50%;
  font-size: 9px; font-weight: 700; min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
}

/* =====================================================
   OVERLAY — oscurece el fondo cuando el catálogo está abierto
   ===================================================== */
#menuOverlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 90;
}
#menuOverlay.open { display: block; }

/* =====================================================
   PAGE WRAPPER — max-width 1200px centrado
   ===================================================== */
.page-wrapper {
  max-width: 1200px; margin: 0 auto;
  background: #fff; box-shadow: 0 0 0 1px var(--border);
}

/* =====================================================
   FILA SUPERIOR: sidebar toggle (izq) + banner/liquidación (der)
   ===================================================== */
.page-top-row { display: flex; align-items: flex-start; }

/* ==============================================
   SIDEBAR CATÁLOGO:
   - Oculto por defecto (no visible al cargar)
   - Aparece en su lugar (dentro del layout) al hacer clic en Catálogo
   ============================================== */
#leftSb {
  display: none;                          /* oculto al cargar */
  width: var(--sb-w); flex-shrink: 0;
  background: #fff; border-right: 1px solid var(--border);
  position: sticky; top: var(--hdr-h);
  max-height: calc(100vh - var(--hdr-h));
  overflow-y: auto; z-index: 100;
  scrollbar-width: thin; scrollbar-color: #ddd #f8f8f8;
}
#leftSb.open { display: block; }          /* visible al abrirse */
#leftSb::-webkit-scrollbar { width: 4px; }
#leftSb::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

.sb-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; cursor: pointer;
  border-bottom: 1px solid #f0f0f8; border-left: 3px solid transparent;
  transition: background .13s, border-color .13s;
}
.sb-item:hover, .sb-item.active {
  background: #c4d9ff; border-left-color: var(--blue);
}
.sb-item.hovered {
  background: #a8c5ff; border-left-color: var(--blue);
}
.sb-item .sb-left { display: flex; align-items: center; gap: 10px; }
.sb-item .sb-icon {
  width: 30px; height: 30px; border-radius: 6px; background: #eef3ff;
  display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
}
.sb-item:hover .sb-icon, .sb-item.active .sb-icon, .sb-item.hovered .sb-icon { background: #a8c5ff; }
.sb-item .sb-name { font-size: 12px; font-weight: 600; color: var(--dark); }
.sb-item:hover .sb-name, .sb-item.active .sb-name, .sb-item.hovered .sb-name { color: var(--blue); }
.sb-item .sb-arrow { font-size: 10px; color: #ccc; }
.sb-item:hover .sb-arrow, .sb-item.active .sb-arrow, .sb-item.hovered .sb-arrow { color: var(--blue); }

/* ===== SUBMENU FLYOUT PANEL (aparece a la derecha del sidebar al hacer hover) ===== */
.sb-sub-panel {
  display: none; position: fixed; z-index: 300;
  width: 380px; background: #fff;
  border: 1px solid var(--border); border-left: 3px solid var(--blue);
  box-shadow: 6px 6px 24px rgba(0,0,0,.16);
  border-radius: 0 8px 8px 0; overflow-y: auto;
}
.sb-sub-panel.open { display: block; }
.sb-sub-grid { display: flex; flex-direction: column; padding: 8px 0; }
.sb-sub-item {
  display: block; padding: 9px 16px;
  font-size: 12px; font-weight: 600; color: var(--dark);
  border-left: 2px solid transparent; cursor: pointer; transition: background .12s, color .12s;
}
.sb-sub-item:hover { background: #eef3ff; color: var(--blue); border-left-color: var(--blue); }

/* Área de contenido superior: toma ancho completo cuando sidebar está cerrado */
#topContent { flex: 1; min-width: 0; background: #fff; }

/* ===== BANNER ===== */
#bannerZone { line-height: 0; }
#bannerZone img { width: 100%; object-fit: cover; }

/* ===== LIQUIDACIÓN ===== */
#liquidacion { padding: 20px 0 8px; background: #fff; }
.section-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; margin-bottom: 14px; }
.section-title { font-size: 18px; font-weight: 800; color: var(--dark); display: flex; align-items: center; gap: 8px; }
.liq-carousel-wrap { position: relative; }
.liq-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; border-radius: 50%;
  background: #fff; border: 2px solid var(--border);
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: var(--dark); z-index: 2; transition: all .18s;
}
.liq-nav:hover { border-color: var(--blue); color: var(--blue); }
.liq-nav-prev { left: 4px; }
.liq-nav-next { right: 4px; }
.liq-carousel {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 4px 44px 12px; scroll-behavior: smooth;
}
.liq-carousel::-webkit-scrollbar { display: none; }
.liq-card {
  flex: 0 0 200px; scroll-snap-align: start;
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  display: flex; align-items: center; gap: 10px; padding: 10px;
  cursor: pointer; transition: box-shadow .18s;
}
.liq-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
.liq-img {
  width: 70px; height: 70px; flex-shrink: 0;
  background: #f4f5f7; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden;
}
.liq-img img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.liq-info { flex: 1; min-width: 0; }
.liq-name { font-size: 11px; font-weight: 600; color: var(--dark); line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.liq-prices { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
.liq-old { font-size: 11px; color: var(--gray); text-decoration: line-through; }
.liq-new { font-size: 15px; font-weight: 800; color: var(--dark); }
.liq-btn { width: 32px; height: 32px; border-radius: 6px; background: var(--blue); color: #fff; border: none; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: background .18s; }
.liq-btn:hover { background: #003d87; }

/* ===== 6 TILES — ancho completo del wrapper ===== */
#advantages { padding: 16px; background: #fff; border-top: 1px solid var(--border); }
.adv-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; }
.adv-tile { border: 1px solid var(--border); border-radius: 8px; padding: 14px 8px; text-align: center; background: #fff; transition: box-shadow .18s; }
.adv-tile:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.adv-tile .adv-icon { font-size: 26px; margin-bottom: 7px; }
.adv-tile .adv-title { font-size: 11px; font-weight: 700; color: var(--dark); margin-bottom: 3px; }
.adv-tile .adv-desc  { font-size: 10px; color: var(--gray); line-height: 1.4; }

/* ===== CLIENT SLIDER — full bleed 100vw ===== */
#sliderZone {
  background: #fff; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 20px 0;
  width: 100vw; position: relative; left: 50%; transform: translateX(-50%);
}
.slider-lbl { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #aaa; margin-bottom: 12px; }
.slider { width: 90%; margin: auto; overflow: hidden; }
.slide-track { display: flex; animation: scrollX 80s linear infinite; width: calc(100px * 90); }
.slide { width: 80px; margin: 0 20px; flex-shrink: 0; }
.slide img { width: 100%; filter: grayscale(60%); opacity: .65; transition: filter .3s, opacity .3s; }
.slide img:hover { filter: grayscale(0); opacity: 1; }
@keyframes scrollX { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-100px * 45)); } }

/* ===== PRODUCTOS — 5 cols desktop ===== */
#productosZone { padding: 16px; background: #fff; border-top: 1px solid var(--border); }
.section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.pills-scroll { overflow-x: auto; display: flex; gap: 8px; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: thin; scrollbar-color: var(--blue) #f0f0f5; }
.pills-scroll::-webkit-scrollbar { height: 3px; }
.pills-scroll::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 3px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border: 2px solid var(--border); border-radius: 50px; background: #fff; font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--dark); transition: all .16s; }
.pill:hover { border-color: var(--blue); color: var(--blue); }
.pill.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.sub-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.sub-toolbar select { font-size: 12px; padding: 5px 10px; border: 1px solid #ddd; border-radius: 6px; background: #fff; outline: none; color: var(--dark); }
#resultCount { font-size: 11px; color: var(--gray); margin-left: auto; }

#productsGrid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
@media (min-width: 576px) { #productsGrid { grid-template-columns: repeat(4,1fr); gap: 12px; } }
@media (min-width: 992px) { #productsGrid { grid-template-columns: repeat(5,1fr); gap: 12px; } }

/* ===== PRODUCT CARD ===== */
.pc { background: #fff; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; transition: box-shadow .18s, transform .18s; cursor: pointer; overflow: hidden; }
.pc:hover { box-shadow: 0 6px 20px rgba(0,0,0,.1); transform: translateY(-2px); }
.pc-img-wrap { position: relative; background: #fff; height: 130px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #f5f5f8; overflow: hidden; flex-shrink: 0; }
.pc-img-wrap img { height: 100%; width: 100%; object-fit: contain; padding: 8px; }
.pc-emoji { font-size: 3rem; }
.pc-stickers { position: absolute; bottom: 5px; left: 5px; display: flex; flex-wrap: wrap; gap: 3px; }
.sticker { font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; color: #fff; }
.sticker-liq     { background: var(--red); }
.sticker-popular { background: var(--purple); }
.sticker-pop2    { background: var(--dark); }
.sticker-rec     { background: var(--blue); }
.pc-body { padding: 9px 10px 5px; flex: 1; display: flex; flex-direction: column; }
.pc-name { font-size: 11px; font-weight: 700; color: var(--dark); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
.pc-sku  { font-size: 10px; color: var(--gray); margin-bottom: 3px; }
.pc-stars { display: flex; align-items: center; gap: 2px; margin-bottom: 5px; }
.pc-stars .star { color: #ffc107; font-size: 11px; }
.pc-stars .rev-count { font-size: 10px; color: var(--gray); margin-left: 2px; }
.pc-price-row { margin-top: auto; }
.pc-price-old { font-size: 13px; font-weight: 400; color: var(--gray); text-decoration: line-through; line-height: 1.2; }
.pc-price { font-size: 16px; font-weight: 800; color: var(--dark); line-height: 1.2; }
.pc-inc   { font-size: 10px; font-weight: 400; color: var(--gray); }
.pc-no-price { font-size: 11px; color: var(--gray); }
.pc-footer { padding: 6px 8px 8px; }
.qty-cart-row { display: flex; align-items: center; gap: 5px; }
.qty-ctrl { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 50px; overflow: hidden; height: 30px; }
.qty-ctrl button { width: 26px; height: 30px; background: #f8f9fa; border: none; font-size: 15px; color: var(--dark); display: flex; align-items: center; justify-content: center; }
.qty-ctrl button:hover { background: #e8e9ef; }
.qty-ctrl input { width: 28px; height: 30px; border: none; text-align: center; font-size: 12px; font-weight: 700; outline: none; font-family: inherit; color: var(--dark); }
.btn-agregar { flex: 1; height: 30px; background: var(--blue); color: #fff; border: none; border-radius: 6px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; transition: background .18s; }
.btn-agregar:hover { background: #003d87; }
.btn-agregar.added { background: #198754; }

/* ===== LOADING / EMPTY ===== */
#loadingState { min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--gray); }
.spinner { width: 40px; height: 40px; border: 4px solid #e0e0e8; border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#emptyState { display: none; text-align: center; padding: 50px 20px; color: var(--gray); }
#emptyState i { font-size: 3rem; opacity: .25; margin-bottom: 12px; display: block; }
.btn-reset { margin-top: 10px; background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 8px 24px; font-size: 13px; font-weight: 600; }

/* ===== PAGINATION ===== */
#pagination { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 16px; }
.pg-btn { min-width: 34px; height: 34px; padding: 0 8px; border: 2px solid var(--border); border-radius: 8px; background: #fff; font-size: 12px; font-weight: 600; color: var(--dark); transition: all .16s; }
.pg-btn:hover { border-color: var(--blue); color: var(--blue); }
.pg-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ===== REVIEWS ===== */
#reviewsZone { padding: 0 16px 20px; background: #fff; border-top: 1px solid var(--border); }
.rev-empty { text-align: center; padding: 30px; color: #ccc; font-size: 13px; }

/* ===== FOOTER ===== */
footer { background: var(--foot-bg); color: rgba(255,255,255,.7); }
.foot-cols { padding: 28px 24px 20px; display: grid; grid-template-columns: repeat(4,1fr); gap: 24px; max-width: 1200px; margin: 0 auto; }
.foot-col-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #fff; margin-bottom: 14px; }
.foot-links a { display: block; font-size: 12px; color: rgba(255,255,255,.65); margin-bottom: 7px; transition: color .16px; }
.foot-links a:hover { color: #fff; }
.foot-social-row { display: flex; gap: 10px; margin-bottom: 14px; }
.foot-soc { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; transition: background .18s; }
.foot-soc:hover { background: rgba(255,255,255,.28); }
.sub-form { display: flex; flex-direction: column; gap: 8px; }
.sub-form input { height: 36px; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; background: rgba(255,255,255,.08); color: #fff; padding: 0 12px; font-size: 13px; outline: none; font-family: inherit; }
.sub-form input::placeholder { color: rgba(255,255,255,.5); }
.sub-form button { height: 36px; border-radius: 6px; background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.25); font-size: 13px; font-weight: 600; }
.sub-agree { margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,.6); }
.sub-agree a { color: rgba(255,255,255,.8); text-decoration: underline; }
.foot-bottom { border-top: 1px solid rgba(255,255,255,.1); text-align: center; padding: 14px; font-size: 11px; color: rgba(255,255,255,.45); }

/* ===== MODALES ===== */
.modal-over { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 900; align-items: flex-end; justify-content: center; }
.modal-over.open { display: flex; }
.modal-box { background: #fff; width: 100%; max-width: 640px; max-height: 88vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; animation: slideUp .22s ease; }
@keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.mhdr { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 700; }
.mbody { overflow-y: auto; flex: 1; }
.mfoot { padding: 14px 20px; border-top: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.m-close { background: none; border: none; font-size: 20px; color: #999; }
.cart-empty-msg { text-align: center; padding: 50px 20px; color: #bbb; }
.cart-empty-msg i { font-size: 3rem; display: block; margin-bottom: 10px; }
.cart-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
