<style>
:root {
  /* --- Paleta exacta del sitio original --- */
  --blue:        #004EA5;   /* azul primario: header, botones, footer, links */
  --blue-light:  #359aee;   /* azul secundario: CTA secundario */
  --dark:        #1c1c28;   /* dark navy: texto principal */
  --body-text:   #212529;   /* casi negro: body text */
  --gray:        #8f90a6;   /* gris azulado: textos secundarios, precio tachado */
  --icon-gray:   #555770;   /* iconos header */
  --red:         #e53535;   /* descuentos, alertas */
  --green:       #06c270;   /* stock disponible */
  --purple:      #9615aa;   /* sticker/badge especial */
  --light:       #f8f9fa;   /* background body */
  --border:      #e4e6ef;
  --hdr-h:       64px;
  --sb-w:        270px;
  --foot-bg:     #004EA5;   /* footer azul igual que el primario */
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Montserrat', sans-serif; background: var(--light); color: var(--body-text); font-size: 14px; font-weight: 500; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
button { cursor: pointer; font-family: inherit; }
img { max-width: 100%; display: block; }

/* ===== TOP PROMO BAR ===== */
#topBar {
  background: #0a1628;
  color: #fff;
  font-size: 11px;
  display: flex;
  align-items: stretch;
  min-height: 52px;
}
.tb-delivery {
  background: linear-gradient(135deg, #0d6efd 0%, #0a4fd4 100%);
  display: flex; align-items: center; gap: 10px;
  padding: 8px 20px;
  flex-shrink: 0;
  white-space: nowrap;
}
.tb-delivery .tb-truck { font-size: 24px; }
.tb-delivery strong { display: block; font-size: 13px; font-weight: 800; letter-spacing: .04em; }
.tb-delivery span   { font-size: 10px; color: #cde; }
.tb-promo {
  background: #0e1f3d;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 6px 24px;
  border-left: 1px solid rgba(255,255,255,.08);
  border-right: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.tb-promo .promo-date  { font-size: 13px; font-weight: 700; color: #ffd700; }
.tb-promo .promo-deal  { font-size: 11px; color: #bcd; }
.tb-promo .promo-deal strong { color: #ffd700; font-size: 14px; }
.tb-advs {
  display: flex; align-items: center; flex: 1;
  padding: 0 12px; gap: 0;
  overflow: hidden;
}
.tb-adv {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px;
  border-right: 1px solid rgba(255,255,255,.08);
  flex: 1; min-width: 0;
}
.tb-adv:last-child { border-right: none; }
.tb-adv i { font-size: 18px; color: #6ea8fe; flex-shrink: 0; }
.tb-adv span { font-size: 10px; color: #cde; line-height: 1.3; }

/* ===== INFO BAR ===== */
#infoBar {
  background: var(--blue);
  color: #fff;
  font-size: 12px;
  line-height: 1.4;
}
#infoBar .ib-inner {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; padding: 10px 20px;
}
#infoBar p { margin: 0; }
.ib-close {
  background: #dc3545;
  color: #fff; border: none;
  border-radius: 4px;
  padding: 4px 14px;
  font-size: 12px; font-weight: 600;
  white-space: nowrap; flex-shrink: 0;
}
.ib-close:hover { background: #fff; color: #dc3545; }

/* ===== LOGO NAV (scrolls away) ===== */
#logoNav {
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px;
}
#logoNav .logo img { height: 38px; }
#logoNav .nav-links {
  display: flex; gap: 24px; align-items: center;
  font-size: 12px; font-weight: 600;
}
#logoNav .nav-links a { color: #444; transition: color .18s; }
#logoNav .nav-links a:hover { color: var(--blue); }
#logoNav .nav-links a.hot { color: #dc3545; }

/* ===== STICKY HEADER ===== */
#stickyHdr {
  position: sticky; top: 0; z-index: 500;
  background: #fff;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  height: var(--hdr-h);
  display: flex; align-items: center;
  padding: 0 16px; gap: 12px;
}
#stickyHdr .cat-btn {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid #ccc; border-radius: 6px;
  background: #f8f9fa; padding: 0 18px;
  height: 40px; font-size: 13px; font-weight: 600;
  color: var(--dark); white-space: nowrap; flex-shrink: 0;
  min-width: 160px; justify-content: center;
  transition: border-color .18s;
}
#stickyHdr .cat-btn:hover { border-color: var(--blue); }
#stickyHdr .cat-btn i { color: var(--blue); }
.search-row {
  flex: 1; display: flex; align-items: center;
}
.search-row input {
  flex: 1; height: 40px;
  border: 2px solid var(--border); border-right: none;
  border-radius: 8px 0 0 8px;
  padding: 0 16px; font-size: 13px; outline: none;
  font-family: inherit; transition: border-color .18s;
}
.search-row input:focus { border-color: var(--blue); }
.search-row .s-btn {
  height: 40px; width: 48px;
  background: var(--blue); color: #fff; border: none;
  border-radius: 0 8px 8px 0;
  font-size: 15px; transition: background .18s;
}
.search-row .s-btn:hover { background: #0b5ed7; }
.hdr-actions {
  display: flex; align-items: center; gap: 2px;
}
.act-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none;
  padding: 4px 12px; border-radius: 8px;
  font-size: 10px; font-weight: 500; color: var(--dark);
  transition: background .18s; position: relative;
}
.act-btn:hover { background: #f0f2f8; }
.act-btn i { font-size: 18px; }
.act-btn .badge {
  position: absolute; top: 2px; right: 8px;
  background: #dc3545; color: #fff;
  border-radius: 50%; font-size: 9px; font-weight: 700;
  min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
}
.mob-menu-btn {
  background: none; border: none; font-size: 22px; color: var(--dark);
  padding: 4px 8px; display: none;
}

/* ===== PAGE BODY (two columns) ===== */
#pageBody {
  display: flex; align-items: flex-start;
  min-height: calc(100vh - var(--hdr-h));
}

/* ===== LEFT SIDEBAR ===== */
#leftSb {
  width: var(--sb-w);
  flex-shrink: 0;
  position: sticky;
  top: var(--hdr-h);
  height: calc(100vh - var(--hdr-h));
  overflow-y: auto;
  background: #fff;
  border-right: 1px solid var(--border);
  scrollbar-width: thin;
  scrollbar-color: #ddd #f8f8f8;
}
#leftSb::-webkit-scrollbar { width: 4px; }
#leftSb::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

.sb-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px; border-bottom: 1px solid #f5f5f8;
  cursor: pointer; transition: background .15s;
}
.sb-item:hover { background: #f0f4ff; }
.sb-item .sb-left { display: flex; align-items: center; gap: 12px; }
.sb-item .sb-icon {
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  background: #f0f4ff;
}
.sb-item .sb-name { font-size: 13px; font-weight: 500; color: var(--dark); }
.sb-item .sb-arrow { font-size: 10px; color: #bbb; transition: transform .2s; }
.sb-item.open .sb-arrow { transform: rotate(90deg); }
.sb-item:hover .sb-name { color: var(--blue); }
.sb-subs { display: none; background: #f8f9ff; border-bottom: 1px solid #f0f0f8; }
.sb-subs.open { display: block; }
.sb-subs a {
  display: block; padding: 7px 16px 7px 60px;
  font-size: 12px; color: #555;
  border-left: 3px solid var(--blue);
  transition: background .12s, color .12s;
}
.sb-subs a:hover { background: #e8eeff; color: var(--blue); }

/* ===== MAIN AREA ===== */
#mainArea {
  flex: 1; min-width: 0; overflow: hidden;
  max-width: 1200px;
}

/* ===== BANNER ===== */
#bannerZone { line-height: 0; }
#bannerZone img { width: 100%; max-height: 380px; object-fit: cover; }

/* ===== LIQUIDACIÓN ===== */
#liquidacion {
  padding: 20px 20px 10px;
}
.section-title {
  font-size: 20px; font-weight: 800; color: var(--dark); margin-bottom: 16px;
}
.liq-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.liq-card {
  background: #fff; border-radius: 10px;
  border: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  padding: 14px; overflow: hidden;
}
.liq-img {
  width: 80px; height: 80px; flex-shrink: 0;
  border-radius: 8px; background: #f4f5f7;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem; overflow: hidden;
}
.liq-img img { width: 100%; height: 100%; object-fit: contain; }
.liq-info { flex: 1; min-width: 0; }
.liq-name { font-size: 13px; font-weight: 600; color: var(--dark); line-height: 1.3; margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.liq-prices { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.liq-old { font-size: 14px; font-weight: 400; color: var(--gray); text-decoration: line-through; }
.liq-new { font-size: 20px; font-weight: 800; color: var(--dark); }
.liq-btn {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--blue); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  transition: background .18s;
}
.liq-btn:hover { background: #0b5ed7; }
.liq-empty { color: #bbb; font-size: 13px; padding: 20px 0; }

/* ===== ADVANTAGE TILES ===== */
#advantages { padding: 10px 20px 20px; }
.adv-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}
.adv-tile {
  background: #fff; border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 10px;
  text-align: center; transition: box-shadow .18s;
}
.adv-tile:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.adv-tile .adv-icon { font-size: 28px; margin-bottom: 8px; }
.adv-tile .adv-title { font-size: 12px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
.adv-tile .adv-desc { font-size: 10px; color: var(--gray); line-height: 1.4; }

/* ===== CLIENT SLIDER ===== */
#sliderZone {
  background: #fff; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 22px 0;
}
.slider-lbl {
  text-align: center; font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: #aaa; margin-bottom: 14px;
}
.slider { width: 90%; margin: auto; overflow: hidden; }
.slide-track {
  display: flex;
  animation: scrollX 80s linear infinite;
  width: calc(100px * 90);
}
.slide { width: 80px; margin: 0 20px; flex-shrink: 0; }
.slide img { width: 100%; filter: grayscale(60%); opacity: .65; transition: filter .3s, opacity .3s; }
.slide img:hover { filter: grayscale(0); opacity: 1; }
@keyframes scrollX {
  0%   { transform: translateX(0); }
  100% { transform: translateX(calc(-100px * 45)); }
}

/* ===== PRODUCTS SECTION ===== */
#productosZone { padding: 16px 20px; }
.prod-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
}
.pills-scroll {
  flex: 1; overflow-x: auto; display: flex; gap: 8px; padding-bottom: 4px;
  scrollbar-width: thin; scrollbar-color: var(--blue) #f0f0f5;
}
.pills-scroll::-webkit-scrollbar { height: 3px; }
.pills-scroll::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 3px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 14px;
  border: 2px solid var(--border); border-radius: 50px;
  background: #fff; font-size: 12px; font-weight: 500;
  white-space: nowrap; color: var(--dark); transition: all .16s;
}
.pill:hover { border-color: var(--blue); color: var(--blue); }
.pill.active { background: var(--blue); border-color: var(--blue); color: #fff; }

.sub-toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.sub-toolbar select {
  font-size: 12px; padding: 5px 10px; border: 1px solid #ddd;
  border-radius: 6px; background: #fff; outline: none; color: var(--dark);
  max-width: 220px;
}
#resultCount { font-size: 12px; color: var(--gray); margin-left: auto; }

/* Grid: 5 columns desktop, 2 mobile */
#productsGrid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 576px) {
  #productsGrid { grid-template-columns: repeat(5, 1fr); gap: 12px; }
}

/* ===== PRODUCT CARD ===== */
.pc {
  background: #fff; border-radius: 10px;
  border: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: box-shadow .18s, transform .18s; cursor: pointer;
  overflow: hidden;
}
.pc:hover { box-shadow: 0 6px 20px rgba(0,0,0,.1); transform: translateY(-2px); }

.pc-img-wrap {
  position: relative; background: #fff;
  height: 130px; display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid #f5f5f8; overflow: hidden; flex-shrink: 0;
}
.pc-img-wrap img { height: 100%; width: 100%; object-fit: contain; padding: 8px; }
.pc-emoji { font-size: 3rem; }
.pc-stickers {
  position: absolute; bottom: 6px; left: 6px;
  display: flex; flex-wrap: wrap; gap: 3px;
}
.sticker {
  font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px; color: #fff;
}
.sticker-liq     { background: var(--red); }
.sticker-stock   { background: var(--green); color: #fff; }
.sticker-popular { background: var(--purple); }
.sticker-pop2    { background: var(--dark); }
.sticker-rec     { background: var(--blue); }

.pc-body { padding: 10px 10px 6px; flex: 1; display: flex; flex-direction: column; }
.pc-name {
  font-size: 12px; font-weight: 700; color: var(--dark); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
}
.pc-sku  { font-size: 10px; color: var(--gray); margin-bottom: 4px; }
.pc-stars { display: flex; align-items: center; gap: 3px; margin-bottom: 6px; }
.pc-stars .star { color: #ffc107; font-size: 12px; }
.pc-stars .rev-count { font-size: 11px; color: var(--gray); margin-left: 2px; }
.pc-price-row { margin-top: auto; }
.pc-price-old { font-size: 16px; font-weight: 400; color: var(--gray); text-decoration: line-through; line-height: 1.2; }
.pc-price     { font-size: 20px; font-weight: 800; color: var(--dark); line-height: 1.2; }
.pc-inc       { font-size: 11px; font-weight: 400; color: var(--gray); }
.pc-no-price  { font-size: 11px; color: var(--gray); }

.pc-footer { padding: 6px 10px 10px; }
.qty-cart-row { display: flex; align-items: center; gap: 6px; }
.qty-ctrl {
  display: flex; align-items: center; border: 1px solid var(--border);
  border-radius: 50px; overflow: hidden; height: 32px;
}
.qty-ctrl button {
  width: 28px; height: 32px; background: #f8f9fa; border: none;
  font-size: 16px; color: var(--dark); display: flex; align-items: center; justify-content: center;
  transition: background .12s;
}
.qty-ctrl button:hover { background: #e8e9ef; }
.qty-ctrl input {
  width: 32px; height: 32px; border: none; text-align: center;
  font-size: 13px; font-weight: 700; outline: none;
  font-family: inherit; color: var(--dark);
}
.btn-agregar {
  flex: 1; height: 32px; background: var(--blue); color: #fff; border: none;
  border-radius: 6px; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: background .18s;
}
.btn-agregar:hover { background: #0b5ed7; }
.btn-agregar.added { background: #198754; }

/* ===== LOADING / EMPTY ===== */
#loadingState {
  min-height: 250px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; color: var(--gray);
}
.spinner {
  width: 44px; height: 44px;
  border: 4px solid #e0e0e8; border-top-color: var(--blue);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#emptyState {
  display: none; text-align: center; padding: 50px 20px; color: var(--gray);
}
#emptyState i { font-size: 3rem; opacity: .25; margin-bottom: 12px; display: block; }
.btn-reset {
  margin-top: 10px; background: var(--blue); color: #fff; border: none;
  border-radius: 8px; padding: 8px 24px; font-size: 13px; font-weight: 600;
}

/* ===== PAGINATION ===== */
#pagination {
  display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 16px 20px 24px;
}
.pg-btn {
  min-width: 36px; height: 36px; padding: 0 10px;
  border: 2px solid var(--border); border-radius: 8px;
  background: #fff; font-size: 13px; font-weight: 600;
  color: var(--dark); transition: all .16s;
}
.pg-btn:hover { border-color: var(--blue); color: var(--blue); }
.pg-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ===== REVIEWS ===== */
#reviewsZone { padding: 0 20px 24px; }
.reviews-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
}
.rev-card {
  background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px;
}
.rev-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.rev-prod-img {
  width: 54px; height: 54px; border-radius: 6px;
  background: #f4f5f7; flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
}
.rev-prod-img img { width: 100%; height: 100%; object-fit: cover; }
.rev-author { flex: 1; }
.rev-name { font-size: 13px; font-weight: 700; }
.rev-date { font-size: 11px; color: var(--gray); }
.rev-stars { display: flex; gap: 2px; }
.rev-stars .star { color: #ffc107; font-size: 13px; }
.rev-prod-name { font-size: 12px; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
.rev-text { font-size: 12px; color: var(--gray); line-height: 1.5; }
.rev-empty { text-align: center; padding: 30px; color: #ccc; font-size: 13px; }

/* ===== FOOTER ===== */
footer {
  background: var(--foot-bg);
  color: rgba(255,255,255,.7);
}
.foot-subscribe {
  border-bottom: 1px solid rgba(255,255,255,.12);
  padding: 28px 24px;
  display: flex; align-items: center; justify-content: center; gap: 60px; flex-wrap: wrap;
}
.foot-sub-label {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: #fff; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.sub-form { display: flex; gap: 0; }
.sub-form input {
  flex: 1; min-width: 240px; height: 42px;
  border: 1px solid rgba(255,255,255,.25); border-right: none; border-radius: 6px 0 0 6px;
  background: rgba(255,255,255,.08); color: #fff; padding: 0 14px; font-size: 13px; outline: none;
}
.sub-form input::placeholder { color: rgba(255,255,255,.5); }
.sub-form input:focus { background: rgba(255,255,255,.14); }
.sub-form button {
  height: 42px; padding: 0 20px; border-radius: 0 6px 6px 0;
  background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.25);
  font-size: 13px; font-weight: 600; transition: background .18s;
}
.sub-form button:hover { background: rgba(255,255,255,.25); }
.sub-agree { margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,.6); }
.sub-agree a { color: rgba(255,255,255,.8); text-decoration: underline; }

.foot-socials-col {}
.foot-social-lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.foot-social-row { display: flex; gap: 10px; }
.foot-soc {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px; transition: background .18s;
}
.foot-soc:hover { background: rgba(255,255,255,.28); }

.foot-cols {
  padding: 28px 24px 20px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
}
.foot-col-title {
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: #fff; margin-bottom: 14px;
}
.foot-links a {
  display: block; font-size: 12px; color: rgba(255,255,255,.65);
  margin-bottom: 7px; transition: color .16s;
}
.foot-links a:hover { color: #fff; }
.pay-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.pay-row img { height: 26px; border-radius: 4px; opacity: .75; transition: opacity .18s; }
.pay-row img:hover { opacity: 1; }
.foot-bottom {
